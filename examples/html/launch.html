<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClaudeAE Launch</title>
<style>
  html, body { margin: 0; background: #05050a; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #1b1446 0%, #070712 100%); font-family: "Segoe UI", Arial, sans-serif; }
  .line { position: absolute; left: 0; right: 0; top: 380px; text-align: center; overflow: hidden; height: 150px; }
  .word { display: inline-block; font-size: 128px; font-weight: 700; color: #ffffff; letter-spacing: -2px;
    transform: translateY(110%); animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .word:nth-child(2) { animation-delay: 0.12s; color: #f59e7a; }
  @keyframes rise { to { transform: translateY(0); } }
  #sub { position: absolute; top: 560px; left: 0; right: 0; text-align: center; font-size: 40px; color: #c7c2ff; opacity: 0; }
  #card { position: absolute; left: 240px; top: 720px; width: 180px; height: 180px; border-radius: 36px;
    background: #f59e7a; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45); animation: spin 4s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #check { position: absolute; right: 260px; top: 700px; width: 220px; height: 220px; }
  #check circle { fill: none; stroke: #7c6cff; stroke-width: 10; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.2s 0.6s ease-in-out forwards; }
  #check path { fill: none; stroke: #ffffff; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 0.6s 1.6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  #counter { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 72px; font-weight: 600; color: #ffffff; }
  #pill { position: absolute; left: 810px; top: 900px; width: 300px; height: 84px; border-radius: 42px; background: #7c6cff;
    color: #fff; font-size: 34px; font-weight: 600; text-align: center; line-height: 84px; transform: scale(0); }
</style>
</head>
<body>
<div id="stage">
  <div class="line"><span class="word">Meet</span> <span class="word">ClaudeAE</span></div>
  <div id="sub">HTML motion, rebuilt as native After Effects layers</div>
  <div id="card"></div>
  <svg id="check" viewBox="0 0 220 220"><circle cx="110" cy="110" r="95"/><path d="M65 115 L98 146 L158 82"/></svg>
  <div id="counter">0%</div>
  <div id="pill">Open in AE</div>
</div>
<script>
  const DURATION = 4;
  // requestAnimationFrame + performance.now driven fade-in
  const sub = document.getElementById('sub');
  const t0 = performance.now();
  (function tick(now) {
    const t = (now - t0) / 1000;
    const p = Math.min(1, Math.max(0, (t - 0.8) / 0.6));
    sub.style.opacity = String(p * p * (3 - 2 * p));
    sub.style.transform = 'translateY(' + (1 - p) * 30 + 'px)';
    requestAnimationFrame(tick);
  })(t0);
  // setInterval-driven counter
  let n = 0;
  const counter = document.getElementById('counter');
  setTimeout(() => {
    const id = setInterval(() => { n = Math.min(100, n + 4); counter.textContent = n + '%'; if (n >= 100) clearInterval(id); }, 40);
  }, 1000);
  // Web Animations API pop-in with overshoot
  document.getElementById('pill').animate(
    [{ transform: 'scale(0)' }, { transform: 'scale(1)' }],
    { duration: 700, delay: 2400, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'forwards' }
  );
</script>
</body>
</html>
